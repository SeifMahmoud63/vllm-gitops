apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-ingress
  annotations:
    # 1. نوع الـ Load Balancer مفتوح للإنترنت
    alb.ingress.kubernetes.io/scheme: internet-facing
    # 2. يرسل الترافيك مباشرة لـ Pod IP (الأسرع والأحدث في AWS EKS)
    alb.ingress.kubernetes.io/target-type: ip
    # 3. فحص صحة الخدمة: مسار الـ Health check الخاص بـ vLLM
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm-service
                port:
                  number: 8000
