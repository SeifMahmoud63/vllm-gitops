apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SeifMahmoud63/vllm-gitops.git'
    targetRevision: HEAD
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
