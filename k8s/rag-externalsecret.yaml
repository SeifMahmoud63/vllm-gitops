apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef:
            name: rag-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-external-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: rag-secrets
    creationPolicy: Owner
  data:
    - secretKey: VLLM_API_KEY
      remoteRef:
        key: rag-app-secrets
        property: VLLM_API_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: rag-app-secrets
        property: DATABASE_URL
